{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | BEL'R</title>

    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-card {
            width: 100%;
            max-width: 440px;
            padding: 2.5rem;
            background: #ffffff;
            border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.03), 0 8px 10px -6px rgba(15, 23, 42, 0.03);
        }
        .brand-logo {
            font-weight: 800;
            letter-spacing: -0.04em;
            font-size: 2rem;
            color: #0f172a;
        }
        .brand-subtitle {
            color: #64748b;
            font-size: 0.88rem;
            font-weight: 500;
        }
        .form-label-premium {
            font-size: 0.75rem;
            font-weight: 700;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }
        .login-card input[type="text"], 
        .login-card input[type="password"],
        .login-card input[type="email"] {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s ease;
            background: #f8fafc;
        }
        .login-card input[type="text"]:focus, 
        .login-card input[type="password"]:focus,
        .login-card input[type="email"]:focus {
            outline: none;
            border-color: #4f46e5;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }
        .btn-premium {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            width: 100%;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 0.5rem;
        }
        .btn-premium:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            color: white;
        }
        .alert-premium {
            background: #fff1f2;
            color: #e11d48;
            border: none;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .link-forgot {
            font-size: 0.8rem;
            color: #4f46e5;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }
        .link-forgot:hover {
            color: #7c3aed;
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="login-card text-center">
    <div class="mb-3">
        <i class="fa-solid fa-circle-check fa-3x" style="color: #10b981;"></i>
    </div>
    <div class="brand-logo mb-1">C'est parfait !</div>
    <p class="brand-subtitle mb-4">Mot de passe modifié avec succès</p>
    
    <p class="text-muted small mb-4">Votre identité a été sécurisée. Vous pouvez dès à présent vous connecter à la console avec vos nouveaux identifiants.</p>

    <a href="{% url 'login' %}" class="btn btn-premium">Se connecter maintenant</a>
</div>
</body>
