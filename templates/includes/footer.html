<footer class="footer mt-auto py-3 border-top bg-white">
    <div class="container-fluid">
        <div class="row align-items-center">
            <div class="col-md-6">
                <div class="text-muted small">
                    <i class="fas fa-cut me-1"></i>
                    <strong>Belle&Beau Salon</strong> 
                    • Gestion Professionnelle 
                    • v1.0.0
                    <span class="mx-2">•</span>
                    <i class="fas fa-user-tie me-1"></i>
                    {{ user.get_full_name|default:user.username }}
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="text-end small">
                    <!-- System Status -->
                    <span class="system-status me-3">
                        <span class="status-indicator status-online"></span>
                        <span class="text-success">Système en ligne</span>
                    </span>
                    
                    <!-- Database Stats -->
                    <span class="db-stats me-3 d-none d-md-inline">
                        <i class="fas fa-database me-1"></i>
                        <span id="dbCount">0</span> clients
                    </span>
                    
                    <!-- Memory Usage -->
                    <span class="memory-usage d-none d-lg-inline">
                        <i class="fas fa-memory me-1"></i>
                        <span id="memoryUsage">0</span>% utilisé
                    </span>
                    
                    <!-- Copyright -->
                    <span class="mx-2">•</span>
                    <span class="text-muted">
                        &copy; {{ current_year }} Tous droits réservés
                    </span>
                </div>
            </div>
        </div>
        
        <!-- Quick Links -->
        <div class="row mt-2 pt-2 border-top">
            <div class="col-12">
                <div class="quick-links text-center">
                    <a href="#" class="text-muted small me-3">
                        <i class="fas fa-question-circle me-1"></i>Aide
                    </a>
                    <a href="#" class="text-muted small me-3">
                        <i class="fas fa-book me-1"></i>Documentation
                    </a>
                    <a href="#" class="text-muted small me-3">
                        <i class="fas fa-bug me-1"></i>Signaler un bug
                    </a>
                    <a href="#" class="text-muted small me-3">
                        <i class="fas fa-cog me-1"></i>Paramètres
                    </a>
                    <a href="{% url 'logout' %}" class="text-muted small">
                        <i class="fas fa-sign-out-alt me-1"></i>Déconnexion
                    </a>
                </div>
            </div>
        </div>
        
        <!-- Performance Metrics -->
        <div class="row mt-2">
            <div class="col-12">
                <div class="performance-metrics">
                    <div class="progress" style="height: 4px;">
                        <div class="progress-bar bg-success" style="width: 85%"></div>
                        <div class="progress-bar bg-warning" style="width: 10%"></div>
                        <div class="progress-bar bg-danger" style="width: 5%"></div>
                    </div>
                    <div class="d-flex justify-content-between mt-1">
                        <small class="text-muted">
                            <i class="fas fa-check-circle text-success me-1"></i>
                            85% RDV confirmés
                        </small>
                        <small class="text-muted">
                            <i class="fas fa-clock text-warning me-1"></i>
                            10% En attente
                        </small>
                        <small class="text-muted">
                            <i class="fas fa-times-circle text-danger me-1"></i>
                            5% Annulés
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</footer>

<style>
    .footer {
        background: white;
        border-top: 1px solid #e6e9f0;
        margin-top: auto;
    }
    
    .status-indicator {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 5px;
    }
    
    .status-online {
        background-color: #28C76F;
        box-shadow: 0 0 0 2px rgba(40, 199, 111, 0.2);
        animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
        0% {
            box-shadow: 0 0 0 0 rgba(40, 199, 111, 0.7);
        }
        70% {
            box-shadow: 0 0 0 5px rgba(40, 199, 111, 0);
        }
        100% {
            box-shadow: 0 0 0 0 rgba(40, 199, 111, 0);
        }
    }
    
    .quick-links a {
        text-decoration: none;
        transition: all 0.3s ease;
    }
    
    .quick-links a:hover {
        color: var(--primary-color) !important;
    }
    
    .performance-metrics {
        opacity: 0.8;
        transition: opacity 0.3s ease;
    }
    
    .performance-metrics:hover {
        opacity: 1;
    }
    
    @media (max-width: 768px) {
        .footer .col-md-6 {
            text-align: center !important;
            margin-bottom: 0.5rem;
        }
        
        .quick-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        
        .quick-links a {
            margin: 0 5px;
        }
    }
</style>

<script>
    // Update database count
    function updateDbStats() {
        fetch('/api/stats/db-count/')
            .then(response => response.json())
            .then(data => {
                document.getElementById('dbCount').textContent = data.client_count || 0;
            });
    }
    
    // Simulate memory usage
    function updateMemoryUsage() {
        const usage = Math.floor(Math.random() * 30) + 60; // 60-90%
        document.getElementById('memoryUsage').textContent = usage;
        
        // Change color based on usage
        const element = document.querySelector('.memory-usage');
        if (usage > 85) {
            element.classList.add('text-danger');
            element.classList.remove('text-warning', 'text-success');
        } else if (usage > 70) {
            element.classList.add('text-warning');
            element.classList.remove('text-danger', 'text-success');
        } else {
            element.classList.add('text-success');
            element.classList.remove('text-danger', 'text-warning');
        }
    }
    
    // Update current year
    document.addEventListener('DOMContentLoaded', function() {
        const currentYear = new Date().getFullYear();
        document.querySelectorAll('.current_year').forEach(element => {
            element.textContent = currentYear;
        });
        
        // Initialize
        updateDbStats();
        updateMemoryUsage();
        
        // Update every minute
        setInterval(updateDbStats, 60000);
        setInterval(updateMemoryUsage, 30000);
    });
    
    // System health check
    function checkSystemHealth() {
        fetch('/api/system/health/')
            .then(response => response.json())
            .then(data => {
                const statusElement = document.querySelector('.system-status');
                const indicator = statusElement.querySelector('.status-indicator');
                const text = statusElement.querySelector('span:last-child');
                
                if (data.status === 'healthy') {
                    indicator.className = 'status-indicator status-online';
                    text.className = 'text-success';
                    text.textContent = 'Système en ligne';
                } else if (data.status === 'warning') {
                    indicator.className = 'status-indicator status-busy';
                    text.className = 'text-warning';
                    text.textContent = 'Système ralenti';
                } else {
                    indicator.className = 'status-indicator status-offline';
                    text.className = 'text-danger';
                    text.textContent = 'Problèmes système';
                }
            });
    }
    
    // Check system health every 2 minutes
    setInterval(checkSystemHealth, 120000);
    checkSystemHealth(); // Initial check
</script>
